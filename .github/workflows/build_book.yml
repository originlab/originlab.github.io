name: Build static book contents

on:
  workflow_call:
    inputs:
      is_index:
        type: boolean

jobs:
  build:
    env:
      book_folder: ${{ github.event.repository.name }}${{ case(inputs.is_index, '/index', '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Book
        if: ${{ !inputs.is_index }}
        uses: actions/checkout@v6
        with:
          path: ${{ env.book_folder }}
      - name: Checkout Index with Converter
        uses: actions/checkout@v6
        with:
          repository: originlab/originlab.github.io
          path: originlab.github.io
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      #- run: ls -l -R
      - name: Run Converter
        run: dotnet run --project originlab.github.io/converter/generator/generator.csproj -- ${{ env.book_folder }} ${{ case(inputs.is_index, 'merge', '') }}
      - name: Upload book artifact
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: public_html

