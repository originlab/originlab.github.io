name: Publish a book to Pages

on:
  workflow_call:
    inputs:
      is_index:
        type: boolean

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  
  convert:
    uses: ./.github/workflows/converter.yml
    with:
      run_tests: ${{ inputs.is_index }}
      is_index: ${{ inputs.is_index }}
      is_optimizing: true
      upload_converted: true

  optimize:
    needs: convert
    runs-on: ubuntu-latest
    steps:
      - name: Download converted artifact
        uses: actions/download-artifact@v8
        with:
          name: converted
          path: pages

      - name: Install tools
        run: |
          sudo apt-get install -y webp minify parallel

      - name: Optimize still images
        run: |
          parallel -0 -a < (find pages/ \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) -print0) << 'EOF'
            msg=$(cwebp -quiet -lossless -q 100 {} -o {.}.webp 2>&1 >/dev/null)
            status=$?
            if [ $status -eq 0 ]; then
              rm {}
              if [ -n "$msg" ]; then
                echo "::notice::Optimized {}, but had warnings: $msg"
              fi
            else
              echo "::warning::Skipped optimizing {} because $msg"
            fi
          EOF

      - name: Optimize gif images
        run: |
          parallel -0 -a < (find pages/ -iname "*.gif" -print0) << 'EOF'
            msg=$(gif2webp -quiet -min_size -q 100 {} -o {.}.webp 2>&1 >/dev/null)
            status=$?
            if [ $status -eq 0 ]; then
              rm {}
              if [ -n "$msg" ]; then
                echo "::notice::Optimized {}, but had warnings: $msg"
              fi
            else
              echo "::warning::Skipped optimizing {} because $msg"
            fi
          EOF

      - name: Optimize text
        run: |
          find pages/ -name "*.html" | parallel minify --quiet --html-keep-document-tags --html-keep-end-tags --html-keep-whitespace -o {} {}
          find pages/ -name "*.css"  | parallel minify --quiet -o {} {}
          find pages/ -name "*.js"   | parallel minify --quiet -o {} {}

      - name: Upload optimized artifact
        uses: actions/upload-artifact@v7
        with:
          name: optimized
          path: pages
          retention-days: 1

  deploy:
    needs: optimize
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download optimized artifact
        uses: actions/download-artifact@v8
        with:
          name: optimized
          path: pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

