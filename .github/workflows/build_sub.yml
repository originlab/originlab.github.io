## Shared build workflow for sub sites.
name: Build static content for Pages

on:
  workflow_call:

jobs:

  build:
    env:
      book_folder: ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          path: ${{ env.book_folder }}
      - name: Checkout Converter
        uses: actions/checkout@v6
        with:
          repository: originlab/DocGHPagesConverter
          path: converter
      - name: Checkout Index
        uses: actions/checkout@v6
        with:
          repository: originlab/originlab.github.io
          path: converter/templates/wwwroot
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      #- run: ls -l -R
      - name: Run Converter
        run: dotnet run --project converter/generator/generator.csproj -- ${{ env.book_folder }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.book_folder }}/out

