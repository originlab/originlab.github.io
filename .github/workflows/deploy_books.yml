name: Deploy books under docs.originlab.com
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-site-deployment:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        site:
          - user-guide
          - tutorials
          - quick-help
          - origin-help
          - x-function
          - originc
          - labtalk
          - python
          - externalpython
          - com
          - labview
          - app
          - appdev
          - codebuild
          - orglab
          - license
    steps:
      - name: Dispatch deploy.yml for originlab/${{ matrix.site }}
        run: gh workflow run deploy.yml --repo originlab/${{ matrix.site }}
        env:
          GH_TOKEN: ${{ secrets.PAT_DOC_WORKFLOW }}
