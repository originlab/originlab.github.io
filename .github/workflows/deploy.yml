# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  
  build_index:
    uses: ./.github/workflows/build_book.yml
    with:
      is_index: true

  deploy_index:
    needs: build_index
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Chekout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            wwwroot/
          path: _site
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: book
          path: _site
      #- run: ls -l _site
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dispatch_books_deployment:
    needs: deploy_index
    environment: deploy
    runs-on: ubuntu-slim
    strategy:
      matrix:
        site:
          - user-guide
          - tutorials
          - quick-help
          - origin-help
          - x-function
          - originc
          - labtalk
          - python
          - externalpython
          - com
          - labview
          - app
          - appdev
          - codebuild
          - orglab
          - license
    steps:
      - name: Dispatch deploy.yml for originlab/${{ matrix.site }}
        run: gh workflow run deploy.yml --repo originlab/${{ matrix.site }}
        env:
          GH_TOKEN: ${{ secrets.PAT_DOC_WORKFLOW }}

    
