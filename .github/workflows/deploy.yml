# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  sites: |
    [
      "user-guide",
      "tutorials",
      "quick-help",
      "origin-help",
      "x-function",
      "originc",
      "labtalk",
      "python",
      "externalpython",
      "com",
      "labview",
      "app",
      "appdev",
      "codebuild",
      "orglab",
      "license"
    ]

jobs:
  
  build_index:
    uses: ./.github/workflows/build_book.yml
    with:
      is_index: true

  deploy_index:
    needs: build_index
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: book
          path: _site
      #- run: ls -l _site
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  start_book_deploy:
    needs: deploy_index
    runs-on: ubuntu-slim
    environment: deploy
    env:
      GH_TOKEN: ${{ secrets.PAT_DOC_WORKFLOW }}
    strategy:
      matrix:
        site: ${{ fromJson(env.sites) }}
    outputs:
      run_id-${{ matrix.site }}: ${{ steps.grabRunId.outputs.id }}
    steps:
      - name: Dispatch deploy.yml and capture the run url
        id: dispatch
        run: echo "deploy_run_url=$(gh workflow run deploy.yml --repo originlab/${{ matrix.site }})" >> "$GITHUB_ENV"
      - name: Grab the run id
        id: grabRunId
        run: echo "id=$(echo "$deploy_run_url" | grep -oE "[0-9]+$")" >> "$GITHUB_OUTPUT"

  watch_book_deploy:
    needs: start_book_deploy
    runs-on: ubuntu-slim
    environment: deploy_watch
    env:
      GH_TOKEN: ${{ secrets.PAT_DOC_WORKFLOW }}
    strategy:
      matrix:
        site: ${{ fromJson(env.sites) }}
    steps:
      - name: Set $deploy_run_id
        run: echo 'deploy_run_id=${{ needs.start_book_deploy.outputs[format('run_id-{0}', matrix.site)] }}' >> "$GITHUB_ENV"
      - name: Watch the deployment
        run: gh run watch $deploy_run_id -R originlab/${{ matrix.site }} -i 30 --exit-status
      - name: Set $deploy_job_id
        run: echo "deploy_job_id=$(gh run view $deploy_run_id -R originlab/${{ matrix.site }} | grep 'build_book / build' | grep -oP '\(ID \K\d+')" >> "$GITHUB_ENV"
      - name: Print converter output
        run: >
          gh run view $deploy_run_id -j $deploy_job_id -R originlab/${{ matrix.site }} --log
          | awk '/generator\.csproj/ {f=1} /upload-artifact/ {f=0} f'
          | cut -f3- | cut -d' ' -f2-
      - name: Print the book artifact summary
        run: >
          gh run view $deploy_run_id -j $deploy_job_id -R originlab/${{ matrix.site }} --log
          | awk '/Run actions\/upload-artifact|Finished uploading/{f=1} /Beginning upload|Artifact download/{f=0} f'
          | cut -f3- | cut -d' ' -f2-
      

        
